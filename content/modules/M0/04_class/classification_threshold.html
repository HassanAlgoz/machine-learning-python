<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Classification Threshold</title>
<style>
    :root {
        --bg-color: #f8f9fa;
        --border-color: #dadce0;
        --text-color: #202124;
        --positive-color: #1a73e8; /* Blue */
        --negative-color: #d93025; /* Red */
        --positive-bg: rgba(26, 115, 232, 0.1);
        --negative-bg: rgba(217, 48, 37, 0.1);
        --threshold-line: #000000;
        --font-family: system-ui, -apple-system, sans-serif;
    }

    body {
        font-family: var(--font-family);
        color: var(--text-color);
        background: #ffffff;
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    .container {
        width: 100%;
        max-width: 800px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 24px;
        background: var(--bg-color);
    }

    .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    select, input[type="range"] {
        padding: 8px;
        font-size: 16px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
    }

    .slider-container {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .plot-container {
        position: relative;
        width: 100%;
        height: 180px;
        background: #fff;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 12px;
    }

    #plot {
        width: 100%;
        height: 100%;
        display: block;
    }

    .legend {
        display: flex;
        justify-content: center;
        gap: 24px;
        margin-bottom: 24px;
        font-size: 14px;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .shape-circle {
        width: 10px; height: 10px; border-radius: 50%; background: #666;
    }

    .shape-cross {
        width: 12px;
        height: 12px;
        position: relative;
        display: inline-block;
        background: none;
    }
    .shape-cross::before,
    .shape-cross::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 12px;
        height: 2px;
        background: #666;
        border-radius: 1px;
        /* Angle both lines at 45 and -45 degrees for an 'X' like in tic-tac-toe */
    }
    .shape-cross::before {
        transform: translate(-50%, -50%) rotate(45deg);
    }
    .shape-cross::after {
        transform: translate(-50%, -50%) rotate(-45deg);
    }

    .confusion-matrix {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
        background: #fff;
    }

    .confusion-matrix th, .confusion-matrix td {
        border: 1px solid var(--border-color);
        padding: 12px;
        width: 33%;
    }

    .confusion-matrix th {
        background: #f1f3f4;
        font-weight: 500;
    }

    .metric-val {
        font-size: 24px;
        font-weight: bold;
        display: block;
        margin-top: 4px;
    }

    .tp, .tn { color: #1e8e3e; }
    .fp, .fn { color: #d93025; }

</style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <div class="control-group">
            <label for="dataset"><strong>Dataset</strong></label>
            <select id="dataset">
                <option value="separated">Separated</option>
                <option value="unseparated">Unseparated</option>
                <option value="imbalanced">Imbalanced</option>
            </select>
        </div>
        
        <div class="control-group">
            <label for="threshold"><strong>Classification threshold: <span id="threshold-display">0.50</span></strong></label>
            <div class="slider-container">
                0.0
                <input type="range" id="threshold" min="0" max="1" step="0.01" value="0.5">
                1.0
            </div>
        </div>
    </div>

    <div class="plot-container">
        <svg id="plot">
            <rect id="bg-neg" x="0" y="0" height="100%" fill="var(--negative-bg)"></rect>
            <rect id="bg-pos" y="0" height="100%" fill="var(--positive-bg)"></rect>
            
            <g id="points-layer"></g>
            
            <line id="threshold-line" y1="0" y2="100%" stroke="var(--threshold-line)" stroke-width="2"></line>
        </svg>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="shape-circle"></div> Correct Prediction</div>
        <div class="legend-item"><div class="shape-cross"></div> Incorrect Prediction</div>
    </div>

    <table class="confusion-matrix">
        <tr>
            <th></th>
            <th>Actually Positive</th>
            <th>Actually Negative</th>
        </tr>
        <tr>
            <th>Predicted Positive</th>
            <td>True Positive (TP)<span id="val-tp" class="metric-val tp">0</span></td>
            <td>False Positive (FP)<span id="val-fp" class="metric-val fp">0</span></td>
        </tr>
        <tr>
            <th>Predicted Negative</th>
            <td>False Negative (FN)<span id="val-fn" class="metric-val fn">0</span></td>
            <td>True Negative (TN)<span id="val-tn" class="metric-val tn">0</span></td>
        </tr>
    </table>
</div>

<script>
    const svgNS = "http://www.w3.org/2000/svg";
    const plot = document.getElementById('plot');
    const bgNeg = document.getElementById('bg-neg');
    const bgPos = document.getElementById('bg-pos');
    const pointsLayer = document.getElementById('points-layer');
    const threshLine = document.getElementById('threshold-line');
    
    const thresholdSlider = document.getElementById('threshold');
    const thresholdDisplay = document.getElementById('threshold-display');
    const datasetSelect = document.getElementById('dataset');

    const tpEl = document.getElementById('val-tp');
    const fpEl = document.getElementById('val-fp');
    const fnEl = document.getElementById('val-fn');
    const tnEl = document.getElementById('val-tn');

    let currentData = [];

    function generateData(type) {
        const data = [];
        const numPoints = 120;

        for(let i = 0; i < numPoints; i++) {
            let actualPositive;
            let prob;

            if (type === 'separated') {
                actualPositive = i < 60;
                prob = actualPositive ? 0.6 + (Math.random() * 0.4) : Math.random() * 0.4;
            } else if (type === 'unseparated') {
                actualPositive = i < 60;
                prob = actualPositive ? 0.3 + (Math.random() * 0.6) : 0.1 + (Math.random() * 0.6);
            } else if (type === 'imbalanced') {
                actualPositive = i < 12; 
                prob = actualPositive ? 0.5 + (Math.random() * 0.5) : Math.random() * 0.6;
            }
            
            prob = Math.max(0.02, Math.min(0.98, prob));
            let y = 20 + Math.random() * 140; 
            
            data.push({ actualPositive, prob, y });
        }
        return data;
    }

    function update() {
        const threshold = parseFloat(thresholdSlider.value);
        thresholdDisplay.innerText = threshold.toFixed(2);
        
        const width = plot.clientWidth;
        const thresholdX = threshold * width;

        // Update background shading and line position
        bgNeg.setAttribute('width', thresholdX);
        bgPos.setAttribute('x', thresholdX);
        bgPos.setAttribute('width', width - thresholdX);
        
        threshLine.setAttribute('x1', thresholdX);
        threshLine.setAttribute('x2', thresholdX);

        // Clear and redraw points to update shapes
        pointsLayer.innerHTML = '';
        let tp = 0, fp = 0, tn = 0, fn = 0;

        currentData.forEach(point => {
            const predictedPositive = point.prob >= threshold;
            const actualPositive = point.actualPositive;
            
            let isCorrect = false;
            let color = actualPositive ? "var(--positive-color)" : "var(--negative-color)";

            if (predictedPositive && actualPositive) { tp++; isCorrect = true; }
            if (predictedPositive && !actualPositive) { fp++; isCorrect = false; }
            if (!predictedPositive && !actualPositive) { tn++; isCorrect = true; }
            if (!predictedPositive && actualPositive) { fn++; isCorrect = false; }

            const x = point.prob * width;
            const y = point.y;

            if (isCorrect) {
                const circle = document.createElementNS(svgNS, "circle");
                circle.setAttribute("cx", x);
                circle.setAttribute("cy", y);
                circle.setAttribute("r", 5);
                circle.setAttribute("fill", color);
                circle.setAttribute("opacity", 0.85);
                pointsLayer.appendChild(circle);
            } else {
                const line1 = document.createElementNS(svgNS, "line");
                line1.setAttribute("x1", x - 5);
                line1.setAttribute("y1", y - 5);
                line1.setAttribute("x2", x + 5);
                line1.setAttribute("y2", y + 5);
                line1.setAttribute("stroke-width", 2);
                line1.setAttribute("stroke", color);
                line1.setAttribute("opacity", 1);
                pointsLayer.appendChild(line1);
                const line2 = document.createElementNS(svgNS, "line");
                line2.setAttribute("x1", x + 5);
                line2.setAttribute("y1", y - 5);
                line2.setAttribute("x2", x - 5);
                line2.setAttribute("y2", y + 5);
                line2.setAttribute("stroke-width", 2);
                line2.setAttribute("stroke", color);
                line2.setAttribute("opacity", 1);
                pointsLayer.appendChild(line2);
            }
        });

        tpEl.innerText = tp;
        fpEl.innerText = fp;
        tnEl.innerText = tn;
        fnEl.innerText = fn;
    }

    thresholdSlider.addEventListener('input', update);
    
    datasetSelect.addEventListener('change', (e) => {
        currentData = generateData(e.target.value);
        update();
    });

    window.addEventListener('resize', update);

    currentData = generateData('separated');
    // Give the DOM a tiny fraction of a second to establish bounds before first draw
    setTimeout(update, 50); 
</script>

</body>
</html>
